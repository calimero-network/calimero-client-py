name: OpenAPI sync

# Keeps the generated client current with core's OpenAPI document: refreshes
# openapi/openapi.json from core, regenerates calimero_client_py/openapi and
# calimero_client_py/facade.py, and opens (or refreshes) one pull request,
# `chore(api): sync with core <sha>`, on the machine-owned branch
# chore/core-openapi.
#
# Core's openapi-sync.yml sends `repository_dispatch` (type `core-openapi`,
# `client_payload.commit` the full core sha) when the document changes on its
# master; the weekly schedule is the fallback for a missed event. By hand:
#
#   gh workflow run openapi-sync.yml -f ref=master -f dry_run=true
#
# All the editing is in scripts/refresh_openapi.py and
# scripts/generate_openapi_client.py, which run the same by hand.
#
# The pull request is made with a GitHub App installation token, not
# GITHUB_TOKEN: a pull request GITHUB_TOKEN opens or pushes to runs no
# workflow, so it would arrive with no CI at all and read as green.
#
# The App's id and key: GH_APP_ID / GH_APP_PRIVATE_KEY where a repository
# has them (core), otherwise the org-shared ACTIONS_APP_ID (variable) and
# ACTIONS_APP_PRIVATE_KEY (secret).

on:
  repository_dispatch:
    types: [core-openapi]
  workflow_dispatch:
    inputs:
      ref:
        description: "Core branch, tag or sha to read the document from"
        required: false
        default: master
        type: string
      dry_run:
        description: "Regenerate and report, but push nothing"
        required: false
        default: false
        type: boolean
  schedule:
    # Mondays 05:17 UTC.
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Never cancel: a cancelled run can leave the branch pushed with no pull
# request. Queue instead.
concurrency:
  group: openapi-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with core's OpenAPI document
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"

      # The versions the repository pins: the generator in
      # scripts/generate_openapi_client.py, black in pyproject.toml.
      - name: Install the pinned generator and formatter
        run: |
          set -euo pipefail
          generator=$(sed -n 's/^GENERATOR = "\(.*\)"$/\1/p' scripts/generate_openapi_client.py)
          black=$(grep -o '"black==[^"]*"' pyproject.toml | head -1 | tr -d '"')
          test -n "$generator" && test -n "$black"
          pip install "openapi-python-client==$generator" "$black"

      - name: Decide which core commit to read
        id: source
        env:
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.event.client_payload.commit }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            repository_dispatch)
              if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::client_payload.commit must be a full core sha, got '$COMMIT'"
                exit 1
              fi
              echo "args=--commit $COMMIT" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch)
              if ! [[ "${REF:-master}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                echo "::error::ref '$REF' is not a branch, tag or sha"
                exit 1
              fi
              echo "args=--ref ${REF:-master}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "args=--ref master" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Refresh the document and regenerate the client
        id: sync
        env:
          ARGS: ${{ steps.source.outputs.args }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp calimero_client_py/facade.py "$RUNNER_TEMP/facade.before.py"
          # shellcheck disable=SC2086 # ARGS is "--commit <sha>" or "--ref <ref>"
          python scripts/refresh_openapi.py $ARGS
          python scripts/generate_openapi_client.py
          commit=$(python -c 'import json; print(json.load(open("openapi/source.json"))["commit"])')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=${commit:0:9}" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::notice::already in sync with core ${commit:0:9}: nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # New generated files count in the diffs below.
          git add --intent-to-add openapi calimero_client_py/openapi
          git --no-pager diff --stat

      - name: Write the pull request body
        if: steps.sync.outputs.changed == 'true'
        env:
          COMMIT: ${{ steps.sync.outputs.commit }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Regenerates the client from core's OpenAPI document at"
            echo "[\`${COMMIT:0:9}\`](https://github.com/calimero-network/core/commit/$COMMIT)"
            echo "(\`docs/public/openapi.json\`), by \`scripts/refresh_openapi.py\` and"
            echo "\`scripts/generate_openapi_client.py\`."
            echo
            echo "## Facade methods"
            echo
            python scripts/facade_changes.py "$RUNNER_TEMP/facade.before.py" calimero_client_py/facade.py
            echo
            echo "A **removed or renamed** method, or a signature that drops or now requires an"
            echo "argument, breaks callers: release it in a **major** version."
            echo
            echo "## Files"
            echo
            git --no-pager diff --shortstat
            echo
            echo "<details><summary>Every file</summary>"
            echo
            echo '```'
            git --no-pager diff --stat=100
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Opened by \`.github/workflows/openapi-sync.yml\`. The branch \`chore/core-openapi\`"
            echo "is machine-owned and replaced on every sync: push fixes to a branch of your own."
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint a token for this repository
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run != true
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_ID || vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY || secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Only what the sync needs, not everything the App holds.
          permission-contents: write
          permission-pull-requests: write

      - name: Identify the app
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run != true
        id: app
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: echo "uid=$(gh api "/users/${SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pull request
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          APP_UID: ${{ steps.app.outputs.uid }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.sync.outputs.commit }}
          SHORT: ${{ steps.sync.outputs.short }}
        run: |
          set -euo pipefail
          branch="chore/core-openapi"
          title="chore(api): sync with core $SHORT"

          git config user.name "${SLUG}[bot]"
          git config user.email "${APP_UID}+${SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add openapi calimero_client_py/openapi calimero_client_py/facade.py
          leftover=$(git status --porcelain --untracked-files=all | grep -vE '^[MADR] ' || true)
          if [ -n "$leftover" ]; then
            echo "::warning::files the sync does not own changed and were NOT committed:"
            printf '%s\n' "$leftover"
          fi
          git commit -q -m "$title" \
            -m "Regenerated from calimero-network/core@$COMMIT by .github/workflows/openapi-sync.yml."

          # Machine-owned: a later sync replaces it rather than opening a
          # second pull request.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"

          # No --base: the pull request goes to the repository's default branch.
          if gh pr view "$branch" --repo "$REPO" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$branch" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "::notice::refreshed the open pull request for $branch"
          else
            gh pr create --repo "$REPO" --head "$branch" --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr view "$branch" --repo "$REPO" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
