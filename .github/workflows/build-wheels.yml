name: Build and Publish Source Distribution

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-source:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install maturin build twine

    - name: Build source distribution
      run: |
        # Build source distribution using maturin
        maturin build --sdist --out dist
        # Also build using standard Python build tools as backup
        python -m build --sdist --outdir dist

    - name: Upload source artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source-distribution
        path: dist/*.tar.gz
        retention-days: 1

  # Windows has never built this crate. That is not a gap in coverage so much as
  # a hard block downstream: merobox needs to `pip install` here to drive nodes
  # on Windows, and with sdist-only publishing that means compiling a pyo3
  # extension plus `ring` from source on a platform nothing has ever built it
  # for. This job answers whether that works, and produces the wheel that makes
  # it unnecessary if it does.
  build-windows-wheel:
    name: Build Windows wheel
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install maturin

    # `ring` assembles its x86_64 primitives with NASM on windows-msvc. Harmless
    # if a future version stops needing it.
    - name: Install NASM
      uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

    - name: Build the wheel
      run: maturin build --release --out dist

    - name: Show what was produced
      shell: bash
      run: ls -la dist/

    - name: Upload the wheel
      uses: actions/upload-artifact@v4
      with:
        name: windows-wheel
        path: dist/*.whl
        retention-days: 1

  check-version:
    name: Check if version was bumped
    runs-on: ubuntu-latest
    needs: [build-source]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      actions: write
    outputs:
      version-bumped: ${{ steps.check.outputs.bumped }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Check version changes
      id: check
      run: |
        CURRENT_VERSION=$(grep '^version = ' Cargo.toml | cut -d'"' -f2)
        echo "Current version: $CURRENT_VERSION"

        # Get previous version from git history
        PREVIOUS_VERSION=$(git show HEAD~1:Cargo.toml | grep '^version = ' | cut -d'"' -f2 || echo "0.0.0")
        echo "Previous version: $PREVIOUS_VERSION"
        
        # Check if version was bumped
        if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
          echo "Version bumped from $PREVIOUS_VERSION to $CURRENT_VERSION"
          echo "bumped=true" >> $GITHUB_OUTPUT
        else
          echo "No version change detected"
          echo "bumped=false" >> $GITHUB_OUTPUT
        fi

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # The Windows wheel is a hard requirement, not a nice-to-have: merobox
    # installs this package to drive nodes on Windows, and without a wheel that
    # means compiling a pyo3 extension plus `ring` from source there. Letting a
    # release go out sdist-only would silently put that back.
    needs: [build-source, build-windows-wheel, check-version]
    if: github.ref == 'refs/heads/master' && needs.check-version.outputs.version-bumped == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download source artifacts
      uses: actions/download-artifact@v4
      with:
        name: source-distribution
        path: dist/

    - name: Download the Windows wheel
      uses: actions/download-artifact@v4
      with:
        name: windows-wheel
        path: dist/

    - name: Verify what is about to be published
      run: |
        echo "Artifacts staged for PyPI:"
        ls -la dist/

        # Verify the source distribution
        for file in dist/*.tar.gz; do
          echo "Checking $file"
          tar -tzf "$file" | head -10
        done

        # A wheel that silently failed to arrive would republish sdist-only and
        # send Windows back to building from source, which is the whole problem
        # this job exists to stop. `needs` guarantees the job ran; this checks
        # the artifact actually landed in dist/.
        if ! ls dist/*win_amd64*.whl >/dev/null 2>&1; then
          echo "::error::no Windows wheel in dist/ — refusing to publish an sdist-only release"
          exit 1
        fi
        echo "Windows wheel present: $(ls dist/*win_amd64*.whl)"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/
