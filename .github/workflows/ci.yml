name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin
        pip install merobox
        pip install -e ".[dev]"
    
    - name: Check code formatting with Black
      run: |
        black --check .

    # Black gated the Python and nothing gated the Rust, so `src/` had already
    # drifted from rustfmt by the time this was added.
    - name: Check Rust formatting
      run: |
        cargo fmt --check

    # This crate is mostly Rust, and until now nothing ran its Rust tests: the
    # step below builds the extension, so a compile error was caught but a wrong
    # answer was not. The warrant helpers are the first logic here with
    # properties worth asserting directly — that reformatting an intent's
    # arguments cannot change what the signature commits to, above all, since
    # getting that wrong produces warrants the node reads as forged.
    # Without `--features python`, deliberately: that feature turns on pyo3's
    # `extension-module`, which leaves libpython unlinked — right for a wheel's
    # shared object, fatal for a test binary that has no interpreter to borrow
    # those symbols from.
    - name: Run Rust tests
      run: |
        cargo test

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
