[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "calimero-client-py"
# maturin takes it from Cargo.toml.
dynamic = ["version"]
description = "Python client SDK for Calimero Cloud (release-v2)"
authors = [{name = "Calimero Network", email = "support@calimero.network"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Documentation = "https://calimero-network.github.io/calimero-client-py/"
Repository = "https://github.com/calimero-network/calimero-client-py"
Changelog = "https://github.com/calimero-network/calimero-client-py/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.26.0",
    "black==26.3.1",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -s --tb=short --capture=no"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.maturin]
features = ["python"]
module-name = "calimero_client_py"
python-packages = ["calimero"]
python-modules = ["calimero_client_py"]
manifest-path = "Cargo.toml"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
