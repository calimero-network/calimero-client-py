[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "calimero-client-py"
# maturin takes it from Cargo.toml.
dynamic = ["version"]
description = "Python client for Calimero 1.0"
authors = [{name = "Calimero Network", email = "support@calimero.network"}]
readme = "README.md"
requires-python = ">=3.9"
# The generated client (calimero_client_py/openapi): openapi-python-client
# 0.26.2's own requirements for the code it writes.
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Documentation = "https://calimero-network.github.io/calimero-client-py/"
Repository = "https://github.com/calimero-network/calimero-client-py"
Changelog = "https://github.com/calimero-network/calimero-client-py/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.26.0",
    "black==26.10.1",
    "pre-commit",
    # Signs the .mpk the cluster tests install (per-package origins).
    "cryptography",
]
# Opens the recovery disk's files on the holder's side (calimero_client_py.recovery).
recovery = ["cryptography"]
# Regenerates calimero_client_py/openapi (scripts/generate_openapi_client.py).
codegen = [
    "openapi-python-client==0.26.2",
    "black==26.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -s --tb=short --capture=no"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.maturin]
features = ["python"]
# The Rust extension is the package's native half: the sealed channel, the
# streams and the keys. The routes are calimero_client_py/openapi,
# generated from core's OpenAPI document.
module-name = "calimero_client_py._native"
python-packages = ["calimero"]
manifest-path = "Cargo.toml"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
