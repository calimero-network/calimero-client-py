[package]
name = "calimero-client-py"
version = "0.6.31"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
description = "Python client library for Calimero Network"
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/core"
keywords = ["calimero", "blockchain", "api", "client", "web3", "python"]
categories = ["api-bindings", "blockchain", "web-programming"]
# Ensure source distribution includes all necessary files
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
    "CHANGELOG.md",
]

# Make this package standalone, not part of the workspace
[workspace]

[lib]
name = "calimero_client_py"
crate-type = ["cdylib"]

[dependencies]
# Core Calimero crates.
#
# TEMPORARILY on `feat/warrant-credential` rather than master: the warrant types
# and the `perform_intent` client method this crate now binds live on core#3636,
# which has not landed. Every line below must go back to `branch = "master"`
# before this merges — see the PR description. Pinning the branch rather than
# faking the types is deliberate: it means the bindings here are compiled and
# tested against the real definitions, so the flip to master is a one-line
# change with nothing left to discover.
calimero-client = { git = "https://github.com/calimero-network/core", branch = "feat/warrant-credential" }
calimero-primitives = { git = "https://github.com/calimero-network/core", branch = "feat/warrant-credential" }
calimero-server-primitives = { git = "https://github.com/calimero-network/core", branch = "feat/warrant-credential" }
calimero-context-config = { git = "https://github.com/calimero-network/core", branch = "feat/warrant-credential" }
# New here, and the reason warrant minting belongs in this crate rather than in
# a JS client: `Warrant::sign` is already written, so binding it costs a call
# instead of an ed25519-plus-borsh reimplementation.
calimero-account = { git = "https://github.com/calimero-network/core", branch = "feat/warrant-credential" }
borsh = "1.5"

# Python bindings
# `extension-module` is enabled by the `python` feature below, not here.
#
# With it always on, pyo3 deliberately does not link libpython — correct for the
# shared object a wheel ships, and fatal for a test binary, which has no
# interpreter to borrow those symbols from. macOS hides this (its linker resolves
# them lazily); Linux does not, so `cargo test` fails there and only there. The
# `python` feature already existed and was empty, which is this recipe left
# half-wired.
pyo3 = { version = "0.22" }

# Additional dependencies that might be needed
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
hex = "0.4"
eyre = "0.6"
sha2 = "0.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
camino = "1.1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# What maturin builds with (see `[tool.maturin] features` in pyproject.toml).
python = ["pyo3/extension-module"]

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
