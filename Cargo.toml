[package]
name = "calimero-client-py"
version = "0.6.35"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
description = "Python client library for Calimero Network"
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/core"
keywords = ["calimero", "blockchain", "api", "client", "web3", "python"]
categories = ["api-bindings", "blockchain", "web-programming"]
# Ensure source distribution includes all necessary files
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
    "CHANGELOG.md",
]

# Make this package standalone, not part of the workspace
[workspace]

[lib]
name = "calimero_client_py"
crate-type = ["cdylib"]

[dependencies]
# Core Calimero crates, tracking master.
calimero-client = { git = "https://github.com/calimero-network/core", branch = "master" }
calimero-primitives = { git = "https://github.com/calimero-network/core", branch = "master" }
calimero-server-primitives = { git = "https://github.com/calimero-network/core", branch = "master" }
calimero-context-config = { git = "https://github.com/calimero-network/core", branch = "master" }
# Warrant minting lives here rather than in a JS client because `Warrant::sign`
# is already written: binding it costs a call instead of an ed25519-plus-borsh
# reimplementation that would have to stay byte-identical with the node forever.
calimero-account = { git = "https://github.com/calimero-network/core", branch = "master" }
borsh = "1.5"

# Python bindings
# `extension-module` is enabled by the `python` feature below, not here.
#
# With it always on, pyo3 deliberately does not link libpython — correct for the
# shared object a wheel ships, and fatal for a test binary, which has no
# interpreter to borrow those symbols from. macOS hides this (its linker resolves
# them lazily); Linux does not, so `cargo test` fails there and only there. The
# `python` feature already existed and was empty, which is this recipe left
# half-wired.
pyo3 = { version = "0.22" }

# Additional dependencies that might be needed
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
hex = "0.4"
eyre = "0.6"
sha2 = "0.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
camino = "1.1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# What maturin builds with (see `[tool.maturin] features` in pyproject.toml).
python = ["pyo3/extension-module"]

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
