[package]
name = "calimero-client-py"
version = "0.9.0"
edition = "2021"
authors = ["Calimero Limited <info@calimero.network>"]
description = "Python client library for Calimero Cloud (release-v2)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/calimero-network/core"
keywords = ["calimero", "blockchain", "api", "client", "web3", "python"]
categories = ["api-bindings", "blockchain", "web-programming"]
# Ensure source distribution includes all necessary files. Anchored with `/`:
# these are gitignore-style patterns, and a bare `LICENSE*` also matches every
# license file under `.venv/` or `docs/node_modules/`.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
    "/CHANGELOG.md",
]

# Make this package standalone, not part of the workspace
[workspace]

[lib]
name = "calimero_client_py"
crate-type = ["cdylib"]

[dependencies]
# Core's client, from the 1.0.0-rc.1 release tag.
#
# The two move TOGETHER or not at all: moving one alone makes cargo resolve two
# copies of the crates they share, and the error names types rather than
# revisions, which reads as a code problem rather than a resolution one.
calimero-client = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.1", features = ["testing"] }
calimero-identity = { git = "https://github.com/calimero-network/core", tag = "1.0.0-rc.1", features = ["testing"] }
futures-util = "0.3"

# Python bindings
# `extension-module` is enabled by the `python` feature below, not here.
#
# With it always on, pyo3 deliberately does not link libpython — correct for the
# shared object a wheel ships, and fatal for a test binary, which has no
# interpreter to borrow those symbols from. macOS hides this (its linker resolves
# them lazily); Linux does not, so `cargo test` fails there and only there. The
# `python` feature already existed and was empty, which is this recipe left
# half-wired.
pyo3 = { version = "0.22" }

serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time"] }
url = "2.5"
hex = "0.4"

[features]
default = []
# What maturin builds with (see `[tool.maturin] features` in pyproject.toml).
# `abi3-py39`: one wheel per platform, for every CPython from 3.9 on, built
# against the stable ABI instead of one interpreter's.
python = ["pyo3/extension-module", "pyo3/abi3-py39"]

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "z"
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true
